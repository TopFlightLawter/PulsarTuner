name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run unit tests on simulator
        run: |
          xcodebuild test \
            -project PulsarTuner.xcodeproj \
            -scheme PulsarTuner \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'

  build-unsigned-ipa:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned .app for device
        run: |
          xcodebuild -project PulsarTuner.xcodeproj \
            -scheme PulsarTuner \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build \
            build
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/PulsarTuner.app" Payload/
          zip -r PulsarTuner-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsarTuner-unsigned-ipa
          path: PulsarTuner-unsigned.ipa
